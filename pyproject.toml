[project]
name = "aladin"
version = "0.0.1"
description = "把 Modal 上的生成能力封装成个人软件"
requires-python = ">=3.11"
dependencies = [
    # FunctionCall.logs.stream() 需要 >=1.5.5；1.3.3 没有这个接口（实测）。
    "modal==1.5.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",
    "pillow>=12.3.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["httpx>=0.27"]
